name: Sync from the live site
# Copies the game files from the live Netlify site into this repo, so GitHub matches what players see.
# Run it from the Actions tab: Sync from the live site -> Run workflow.
# The commit says [skip netlify]: the live site is already up to date, so Netlify doesn't rebuild it from here.
on: workflow_dispatch
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the live site's files
        run: |
          B=https://floodlight-baseball-dice-lab.netlify.app
          mkdir -p audio netlify/functions dl
          for f in index.html share.jpg manifest.webmanifest package.json audio/voice-calls.mp3 netlify/functions/leaderboard.mjs dl/floodlight-ios-src.zip; do
            curl -fsSL "$B/$f?sync=$GITHUB_RUN_ID" -o "$f"
          done
          ls -la . audio netlify/functions dl
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync the game from the live site [skip netlify]" || echo "Nothing changed"
          git push
