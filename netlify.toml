# The game is a single static page; the only server code is the short save-code function.
[build]
  publish = "."
  functions = "netlify/functions"

# Cross-origin isolation lets the in-browser studio voice run on several processor cores.
# "credentialless" keeps Google Fonts and other public files loading normally.
[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "credentialless"

# The crowd recordings: cached for a week, and readable when the game is opened from another address.
[[headers]]
  for = "/audio/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=604800"
